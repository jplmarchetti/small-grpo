[project]
name = "small-model-grpo"
version = "0.1.0"
description = "GRPO format-vs-correctness study on Qwen2.5-0.5B (GSM8K)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Laptop-safe dependencies: data splits, graders, rewards, GRPO core maths, statistics, reports.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "huggingface-hub>=0.25",  # download the pinned GSM8K parquet files
    "pyarrow>=17.0",          # read them
    "matplotlib>=3.9",        # training curves and report figures
]

[project.optional-dependencies]
# Installed only on the GPU PC (RTX 5070) via the pc-jp-wsl skill: `uv sync --extra train`.
train = [
    "torch>=2.7",
    "transformers>=4.50",
    "peft>=0.15",
    "datasets>=3.0",
]

# The RTX 5070 (Blackwell, sm_120) needs CUDA 12.8+ wheels; other platforms use PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grpo_gsm8k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
