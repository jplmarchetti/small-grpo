# Every fixed setting of the experiment (docs/METHODOLOGY.md §2, §3, §7).
# Identical for all four cells and all seeds. Do not edit without asking.

model:
  name: Qwen/Qwen2.5-0.5B
  revision: 060db6499f32faf8b98477b0a26969ef7d8b9987   # pinned 2026-11-12

data:
  dataset: openai/gsm8k
  config: main
  revision: 740312add88f781978c0658806c59bc2815b9866   # pinned 2026-11-12
  split_seed: 42
  validation_size: 500
  train_size: 1000
  fewshot_size: 4

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: all-linear

training:
  problems_per_step: 2
  group_size: 8
  steps: 500
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 512
  weight_decay: 0.0
  grad_clip_norm: 1.0
  advantage_eps: 1.0e-4
  micro_batch_size: 4
  checkpoint_every: 50
  seeds: [42, 43, 44]
  # Chosen by the LR pilot (checkpoint 8) from {1e-5, 3e-5, 1e-4}; null until then.
  learning_rate: null

lr_pilot:
  # METHODOLOGY §7 and §13: RC, seed 42, 100 steps per learning rate, validation at steps 0, 50, 100.
  # Fixed before any pilot curve exists. A rate "collapses" if, at step 50 or 100, compared with step 0:
  learning_rates: [1.0e-5, 3.0e-5, 1.0e-4]
  steps: 100
  seed: 42
  max_lenient_drop: 0.05        # lenient accuracy falls by more than 5 points (about 2x the noise of 500 problems)
  max_truncation_rise: 0.05     # or the truncation rate rises by more than 5 points
  min_length_ratio: 0.5         # or mean completion length falls below half of step 0
  # Chosen rate: the largest one that does not collapse.

preflight:
  # METHODOLOGY §11 and §13: p0 from 200 problems x group_size samples; few-shot if p0 < 10%.
  p0_threshold: 0.10
  # METHODOLOGY §13 (2026-11-14): the rule chose zero-shot (p0 11.1%, within noise); every cell
  # trains few-shot instead. null = follow the rule.
  fewshot_override: true
  n_sampled_problems: 200
  truncation_alert: 0.10
  sampling_seed: 42
  n_audit: 50          # hand-check sheet, drawn from the B0 of the trained prompt
  audit_seed: 42

evaluation:
  # Greedy evaluation batch. GPU arithmetic depends slightly on batch composition, so this is
  # fixed once and used for every model (B0, B0-fewshot, validation curves, final test).
  batch_size: 32

analysis:
  # Bootstrap over test problems (METHODOLOGY §9): 10,000 resamples, fixed analysis seed.
  n_resamples: 10000
  analysis_seed: 42
